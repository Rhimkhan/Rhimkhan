# Navigate to your repo
cd ~/GITHUB/rhimkhan

# Create the directory structure
mkdir -p .github/workflows

# Create the file
cat > .github/workflows/snake.yml << 'EOF'
name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v2
      
      - name: Generate Snake Animation
        uses: Platane/snk@master
        with:
          github_user_name: rhimkhan
          svg_out_path: github-contribution-grid-snake.svg
          
      - name: Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git commit -m "Update snake animation" || exit 0
          git push
EOF

# Push to GitHub
git add .github/workflows/snake.yml
git commit -m "Add snake animation workflow"
git push origin main
